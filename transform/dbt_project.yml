name: 'financial_context_engine'
version: '1.0.0'
config-version: 2

# Profile name matching profiles.yml database connection config
profile: 'financial_context_engine'

# Folder layouts
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Materialization configurations
models:
  financial_context_engine:
    # Staging models parse JSON, materialized as views to avoid unnecessary writing
    staging:
      +materialized: view
      +schema: staging

    # Intermediate models deduplicate and restructure data
    intermediate:
      +materialized: view
      +schema: intermediate

    # Marts materialize as tables / incremental datasets to optimize query performance
    marts:
      +materialized: incremental
      +schema: analytics
      # Use insert_overwrite or append (or merge if using primary keys). 
      # For fct_context_rows, we'll configure unique_key='row_id' in the model.

vars:
  # RAW_DATA_ROOT overrides the raw_data location for dbt's read_json_auto() calls.
  # Default resolves relative to the `transform/` directory (dbt build is run via
  # `cd transform && dbt build`, so `../raw_data` points at the repo-root landing zone).
  # Docker/Airflow sets RAW_DATA_ROOT=/usr/local/airflow/project/raw_data instead
  # (see orchestration/docker-compose.override.yml).
  google_calendar_events_path: "{{ env_var('RAW_DATA_ROOT', '../raw_data') }}/google_calendar/events/*/*.json"
  alpaca_orders_path: "{{ env_var('RAW_DATA_ROOT', '../raw_data') }}/alpaca/orders/*/*.json"
  alpaca_account_path: "{{ env_var('RAW_DATA_ROOT', '../raw_data') }}/alpaca/account/*/*.json"
  plaid_transactions_path: "{{ env_var('RAW_DATA_ROOT', '../raw_data') }}/plaid/transactions/*/*.json"
  agent_traces_path: "{{ env_var('RAW_DATA_ROOT', '../raw_data') }}/agent_traces/*/*.json"
