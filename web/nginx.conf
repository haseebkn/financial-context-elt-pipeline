# Static SPA hosting only. In production, /api/* never reaches this
# container — the ALB routes /api/* to the agent target group and
# everything else here (see infra/aws/alb.tf). The app's relative
# fetch("/api/...") calls therefore work unchanged from local dev
# (Vite proxy) through to production (ALB path routing).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    location = /healthz {
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
